  <!-- 备注弹窗 -->
  <div class=&quot;mask&quot; id=&quot;remarkMask&quot;>

  <div class=&quot;mask&quot; id=&quot;confirmMask&quot;>

  <!-- 拆分开票弹窗 -->
  <div class=&quot;mask&quot; id=&quot;splitMask&quot;>

        <span>发票拆分设置</span>
        <button class=&quot;close-x&quot; onclick=&quot;closeSplitModal()&quot; aria-label=&quot;关闭&quot;>×</button>
      </div>
      <div class=&quot;modal-bd&quot;>
        <div class=&quot;section-title&quot;>发票信息</div>
        <div class=&quot;info-grid&quot;>
          <div>
            <div class=&quot;label&quot;>发票含税金额</div>
            <div class=&quot;value&quot; id=&quot;splitInfoAmount&quot;>-</div>
          </div>
          <div>
            <div class=&quot;label&quot;>数量</div>
            <div class=&quot;value&quot; id=&quot;splitInfoQty&quot;>-</div>
          </div>

            <div class=&quot;label&quot;>销售方主体</div>
            <div class=&quot;value&quot; id=&quot;splitInfoSeller&quot;>-</div>
          </div>
          <div>
            <div class=&quot;label&quot;>购买方主体</div>
            <div class=&quot;value&quot; id=&quot;splitInfoBuyer&quot;>-</div>

          <div>
            <div class=&quot;label&quot;>商品大类</div>

          </div>

            <div class=&quot;label&quot;>产品名称</div>
            <div class=&quot;value&quot; id=&quot;splitInfoProduct&quot;>-</div>

        <div class=&quot;split-toolbar&quot;>
          <div class=&quot;section-title&quot; style=&quot;margin:0;&quot;>拆分明细</div>
          <button class=&quot;btn primary&quot; onclick=&quot;addSplitRow()&quot;>+ 添加拆分项</button>
        </div>
        <div class=&quot;split-table-wrap&quot;>
          <table>
            <thead>
              <tr>
                <th>销售方主体</th>
                <th>购买方主体</th>
                <th>商品大类</th>
                <th>产品名称</th>
                <th>拆分金额</th>
                <th>拆分数量</th>

              </tr>
            </thead>
            <tbody id=&quot;splitTbody&quot;></tbody>
          </table>
        </div>
        <div class=&quot;split-summary&quot;>
          <div>已拆分金额：<strong id=&quot;splitUsed&quot;>¥0.00</strong></div>
          <div>剩余可拆分金额：<strong id=&quot;splitLeft&quot;>¥0.00</strong></div>
        </div>
      </div>
      <div class=&quot;modal-ft&quot;>
        <button class=&quot;btn&quot; onclick=&quot;closeSplitModal()&quot;>取消</button>
        <button class=&quot;btn primary&quot; onclick=&quot;confirmSplit()&quot;>确认拆分</button>
      </div>
    </div>
  </div>

  <div class=&quot;toast-wrap&quot; id=&quot;toastWrap&quot;></div>

  <script>
    const OFFLINE_MARK = '【已线下开票】';

    /** 模拟发票列表数据（字段对齐 shared_invoice_records 列表） */
    let invoices = [
      {
        id: 10021,
        accounting_period: '202507',
        classify: '购销类关联交易',
        seller_subject_name: '深圳市星桐科技有限公司',
        seller_subject_code: 'SZ01',
        buyer_subject_name: '北京好未来图书有限公司',
        buyer_subject_code: 'BJ09',
        product_category: '思博机(GLJY20250117014)',
        products: '-',
        quantity: 8,
        amount_incl_tax: '628.44',
        invoice_status: 'pending',
        invoice_status_text: '待开票',
        can_split: true,
        remark: '',
        remark_editor_name: '',
        remark_edit_time: ''
      },
      {
        id: 10022,
        accounting_period: '202507',
        classify: '税务TP',
        seller_subject_name: '北京好未来科技有限公司',
        seller_subject_code: 'HWL01',
        buyer_subject_name: '佛山市南海区乐未来科技培训有限公司',
        buyer_subject_code: 'L300756',
        product_category: '技术服务',
        products: '咨询服务',
        quantity: 1,
        amount_incl_tax: '5600.50',
        invoice_status: 'pending',
        invoice_status_text: '待开票',
        can_split: false,
        remark: '已与对方财务确认，线下已开票，请勿重复开具。' + OFFLINE_MARK,
        remark_editor_name: '张三(061097)',
        remark_edit_time: '2025-07-20 15:22:08'
      },
      {
        id: 10023,
        accounting_period: '202507',
        classify: '购销类关联交易',
        seller_subject_name: '欣欣相融教育科技（北京）有限公司',
        seller_subject_code: 'BJ05',
        buyer_subject_name: '北京全场景互联网科技有限公司',
        buyer_subject_code: 'BJ88',
        product_category: '图书(GLJY20250408001)',
        products: '课程',
        quantity: 15,
        amount_incl_tax: '2777.62',
        invoice_status: 'pending',
        invoice_status_text: '待开票',
        can_split: true,
        remark: '待补充合同编号',
        remark_editor_name: '李四(061088)',
        remark_edit_time: '2025-07-18 10:01:00'
      },
      {
        id: 10024,
        accounting_period: '202506',
        classify: '税务TP',
        seller_subject_name: '北京新唐思创教育科技有限公司',
        seller_subject_code: 'XF01',
        buyer_subject_name: '上海市学而思教育信息咨询有限公司',
        buyer_subject_code: 'SH02',
        product_category: '培优技术',
        products: '培优技术服务费',
        quantity: 1,
        amount_incl_tax: '930.00',
        invoice_status: 'success',
        invoice_status_text: '开票成功',
        can_split: false,
        remark: '',
        remark_editor_name: '',
        remark_edit_time: ''
      }
    ];

    let selectedIds = new Set();
    let editingId = null;
    /** 弹窗内是否带「已线下开票」椭圆标签（与 textarea 文本分离展示） */
    let offlineActive = false;
    let splittingId = null;
    let splitRows = [];

    function hasOfflineMark(text) {
      return String(text || '').includes(OFFLINE_MARK);
    }

    function stripOfflineMark(text) {
      return String(text || '')
        .split(OFFLINE_MARK).join('')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function composeRemark(freeText, withMark) {
      const text = String(freeText || '').trim();
      if (!withMark) return text;
      return text ? (text + OFFLINE_MARK) : OFFLINE_MARK;
    }

    function statusClass(status) {
      if (status === 'pending') return 'pending';
      if (status === 'success') return 'success';
      if (status === 'failed') return 'failed';
      return '';
    }

    function renderRemarkCell(row) {
      const withMark = hasOfflineMark(row.remark);
      const free = stripOfflineMark(row.remark);
      const hasContent = withMark || !!free;

      if (!hasContent) {
        return `<button class=&quot;remark-add&quot; onclick=&quot;openRemarkModal(${row.id})&quot;>点击添加备注...</button>`;
      }

      const chip = withMark
        ? `<span class=&quot;mark-chip&quot; style=&quot;margin-bottom:4px;&quot;>已线下开票</span>`
        : '';
      const text = free ? `<div class=&quot;remark-text&quot;>${escapeHtml(free)}</div>` : '';
      const editor = row.remark_editor_name || '-';
      const time = row.remark_edit_time || '-';

      return `
        <div class=&quot;remark-wrap&quot;>
          <div class=&quot;remark-main&quot;>
            ${chip}
            ${text}
            <div class=&quot;remark-meta&quot;>
              <div>最后修改：${escapeHtml(editor)}</div>
              <div>${escapeHtml(time)}</div>
            </div>
          </div>
          <button class=&quot;edit-icon&quot; title=&quot;编辑备注&quot; onclick=&quot;openRemarkModal(${row.id})&quot;>✎</button>
        </div>
      `;
    }

    function renderOpsCell(row) {
      if (row.invoice_status !== 'pending') {
        return '<span class=&quot;muted&quot;>—</span>';
      }
      let html = `<button class=&quot;btn link&quot; onclick=&quot;handleRowInvoice(${row.id})&quot;>开票</button>`;
      if (row.can_split) {
        html += `<button class=&quot;btn link&quot; onclick=&quot;handleRowSplit(${row.id})&quot;>拆分开票</button>`;
      }
      return `<div class=&quot;ops&quot;>${html}</div>`;
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = invoices.map((row) => {
        const checked = selectedIds.has(row.id) ? 'checked' : '';
        const selected = selectedIds.has(row.id) ? 'selected' : '';
        return `
          <tr class=&quot;${selected}&quot;>
            <td class=&quot;col-check&quot;>
              <input type=&quot;checkbox&quot; ${checked} onchange=&quot;toggleRow(${row.id}, this.checked)&quot; />
            </td>
            <td>${row.id}</td>
            <td>${row.accounting_period}</td>
            <td>${row.seller_subject_name}<div class=&quot;muted&quot;>${row.seller_subject_code}</div></td>
            <td>${row.buyer_subject_name}<div class=&quot;muted&quot;>${row.buyer_subject_code}</div></td>
            <td>${escapeHtml(row.product_category || row.products)}</td>
            <td class=&quot;money&quot;>${row.amount_incl_tax}</td>
            <td>${row.quantity}</td>
            <td><span class=&quot;status ${statusClass(row.invoice_status)}&quot;>${row.invoice_status_text}</span></td>
            <td>${renderRemarkCell(row)}</td>
            <td>${renderOpsCell(row)}</td>
          </tr>
        `;
      }).join('');

      const all = invoices.length > 0 &amp;&amp; invoices.every((r) => selectedIds.has(r.id));
      document.getElementById('checkAll').checked = all;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/</g, '&amp;lt;')
        .replace(/>/g, '&amp;gt;')
        .replace(/&quot;/g, '&amp;quot;');
    }

    function toggleAll(checked) {
      selectedIds = checked ? new Set(invoices.map((r) => r.id)) : new Set();
      renderTable();
    }

    function toggleRow(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      renderTable();
    }

    function getSelectedRows() {
      return invoices.filter((r) => selectedIds.has(r.id));
    }

    function assertNoOffline(rows) {
      if (rows.some((r) => hasOfflineMark(r.remark))) {
        toast('存在已线下开票数据，请重新选择');
        return false;
      }
      return true;
    }

    /** 工具栏：批量开票 / 合并开票 */
    function handleInvoiceAction(actionName) {
      const rows = getSelectedRows();
      if (!rows.length) {
        toast('请先选择数据', 'info');
        return;
      }
      if (!assertNoOffline(rows)) return;

      openConfirm(
        actionName,
        `已选择 <strong>${rows.length}</strong> 条数据，确认执行「${actionName}」？
         <div class=&quot;warn&quot;>原型演示：校验通过后才会进入此确认（实际会调后端开票接口）。</div>`,
        () => {
          toast(`${actionName}已提交（原型模拟）`, 'ok');
          closeConfirm();
        }
      );
    }

    /** 操作列：开票 */
    function handleRowInvoice(id) {
      const row = invoices.find((r) => r.id === id);
      if (!row) return;
      if (!assertNoOffline([row])) return;

      openConfirm(
        '开票',
        `确认对发票 <strong>${row.id}</strong> 执行开票？
         <div class=&quot;warn&quot;>含税金额：¥${row.amount_incl_tax}</div>`,
        () => {
          toast('开票已提交（原型模拟）', 'ok');
          closeConfirm();
        }
      );
    }

    /** 操作列：拆分开票 */
    function handleRowSplit(id) {
      const row = invoices.find((r) => r.id === id);
      if (!row) return;
      if (!assertNoOffline([row])) return;
      if (!row.can_split) {
        toast('当前发票不支持拆分', 'info');
        return;
      }
      openSplitModal(row);
    }

    function openSplitModal(row) {
      splittingId = row.id;
      document.getElementById('splitInfoAmount').textContent = '¥' + row.amount_incl_tax;
      document.getElementById('splitInfoQty').textContent = row.quantity;
      document.getElementById('splitInfoSeller').textContent = row.seller_subject_name;
      document.getElementById('splitInfoBuyer').textContent = row.buyer_subject_name;
      document.getElementById('splitInfoCategory').textContent = row.product_category || '-';
      document.getElementById('splitInfoProduct').textContent = row.products || '-';

      // 默认两条拆分项（至少拆成两份）
      splitRows = [
        { amount: '', quantity: '' },
        { amount: '', quantity: '' }
      ];
      renderSplitRows();
      document.getElementById('splitMask').classList.add('show');
    }

    function closeSplitModal() {
      document.getElementById('splitMask').classList.remove('show');
      splittingId = null;
      splitRows = [];
    }

    function addSplitRow() {
      splitRows.push({ amount: '', quantity: '' });
      renderSplitRows();
    }

    function removeSplitRow(index) {
      if (splitRows.length <= 2) {
        toast('至少需要拆分成两份~', 'info');
        return;
      }
      splitRows.splice(index, 1);
      renderSplitRows();
    }

    function onSplitFieldChange(index, field, value) {
      splitRows[index][field] = value;
      updateSplitSummary();
    }

    function renderSplitRows() {
      const row = invoices.find((r) => r.id === splittingId);
      if (!row) return;
      const tbody = document.getElementById('splitTbody');
      tbody.innerHTML = splitRows.map((item, index) => `
        <tr>
          <td>${escapeHtml(row.seller_subject_name)}</td>
          <td>${escapeHtml(row.buyer_subject_name)}</td>
          <td>${escapeHtml(row.product_category || '-')}</td>
          <td>${escapeHtml(row.products || '-')}</td>
          <td>
            <input
              placeholder=&quot;请输入金额&quot;
              value=&quot;${escapeHtml(item.amount)}&quot;
              oninput=&quot;onSplitFieldChange(${index}, 'amount', this.value)&quot;
            />
          </td>
          <td>
            <input
              placeholder=&quot;请输入数量&quot;
              value=&quot;${escapeHtml(item.quantity)}&quot;
              oninput=&quot;onSplitFieldChange(${index}, 'quantity', this.value)&quot;
            />
          </td>
          <td>
            <button class=&quot;icon-del&quot; title=&quot;删除&quot; onclick=&quot;removeSplitRow(${index})&quot;>🗑</button>
          </td>
        </tr>
      `).join('');
      updateSplitSummary();
    }

    function updateSplitSummary() {
      const row = invoices.find((r) => r.id === splittingId);
      if (!row) return;
      const total = Number(row.amount_incl_tax) || 0;
      let used = 0;
      splitRows.forEach((item) => {
        const n = Number(item.amount);
        if (!Number.isNaN(n)) used += n;
      });
      used = Math.round(used * 100) / 100;
      const left = Math.round((total - used) * 100) / 100;
      document.getElementById('splitUsed').textContent = '¥' + used.toFixed(2);
      document.getElementById('splitLeft').textContent = '¥' + left.toFixed(2);
    }

    function confirmSplit() {
      const row = invoices.find((r) => r.id === splittingId);
      if (!row) return;
      // 再次校验：防止打开弹窗后备注被改成已线下开票
      if (!assertNoOffline([row])) return;

      if (splitRows.length < 2) {
        toast('拆分数据不能为空，且至少需要拆分成两份~');
        return;
      }

      for (const item of splitRows) {
        const amt = Number(item.amount);
        const qty = Number(item.quantity);
        if (!item.amount || Number.isNaN(amt) || amt <= 0) {
          toast('拆分的发票金额必须大于 0 ~');
          return;
        }
        if (!item.quantity || Number.isNaN(qty) || qty <= 0) {
          toast('拆分的发票数量必须大于 0 ~');
          return;
        }
      }

      const used = splitRows.reduce((s, item) => s + Number(item.amount), 0);
      const total = Number(row.amount_incl_tax);
      if (Math.abs(used - total) > 0.001) {
        toast('拆分金额合计需等于原发票含税金额~');
        return;
      }

      toast('拆分成功（原型模拟）', 'ok');
      closeSplitModal();
    }

    function openRemarkModal(id) {
      const row = invoices.find((r) => r.id === id);
      if (!row) return;
      editingId = id;

      offlineActive = hasOfflineMark(row.remark);
      const input = document.getElementById('remarkInput');
      // 文本区只展示手写内容，椭圆标签单独展示
      input.value = stripOfflineMark(row.remark);
      syncOfflineUi();
      updateCount();

      document.getElementById('remarkMask').classList.add('show');
      input.focus();
    }

    function closeRemarkModal() {
      document.getElementById('remarkMask').classList.remove('show');
      editingId = null;
      offlineActive = false;
    }

    function updateCount() {
      const free = document.getElementById('remarkInput').value;
      const total = composeRemark(free, offlineActive).length;
      document.getElementById('remarkCount').textContent = total;
    }

    function syncOfflineUi() {
      document.getElementById('offlineCheck').checked = offlineActive;
      document.getElementById('remarkTags').classList.toggle('show', offlineActive);
    }

    function onRemarkInput() {
      updateCount();
    }

    function onOfflineToggle() {
      offlineActive = document.getElementById('offlineCheck').checked;
      syncOfflineUi();
      updateCount();
      document.getElementById('remarkInput').focus();
    }

    function clearOfflineMark() {
      offlineActive = false;
      syncOfflineUi();
      updateCount();
      document.getElementById('remarkInput').focus();
    }

    function saveRemark() {
      if (editingId == null) return;
      const row = invoices.find((r) => r.id === editingId);
      if (!row) return;

      const free = document.getElementById('remarkInput').value;
      const remark = composeRemark(free, offlineActive);
      if (remark.length > 1000) {
        toast('备注不能超过1000个字符~');
        return;
      }

      row.remark = remark;
      row.remark_editor_name = '当前用户(demo)';
      row.remark_edit_time = formatNow();
      renderTable();
      closeRemarkModal();
      toast('备注保存成功', 'ok');
    }

    function formatNow() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function toast(msg, type = 'error') {

        benefit_tax_qualify: '一般纳税人-一般征收',

        draft_file: '技术服务费_计算底稿_C.docx'
      }
    ];

    let selectedIds = new Set();
    let picked = { result: null, draft: null };

    function statusClass(s) {
      if (s === 'PENDING') return 'pending';
      if (s === 'APPROVED') return 'approved';
      if (s === 'REJECTED') return 'rejected';
      return '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/</g, '&amp;lt;')
        .replace(/>/g, '&amp;gt;')
        .replace(/&quot;/g, '&amp;quot;');
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = rows.map((row, idx) => {
        const checked = selectedIds.has(row.id) ? 'checked' : '';
        const selected = selectedIds.has(row.id) ? 'selected' : '';
        return `
          <tr class=&quot;${selected}&quot;>
            <td><input type=&quot;checkbox&quot; ${checked} onchange=&quot;toggleRow(${row.id}, this.checked)&quot; /></td>
            <td>${idx + 1}</td>
            <td>${row.month}</td>
            <td><code>${row.import_batch_id}</code></td>
            <td class=&quot;wrap&quot;>${escapeHtml(row.transaction_type)}</td>
            <td>${escapeHtml(row.legal_entity_code)}</td>
            <td class=&quot;wrap&quot;>${escapeHtml(row.legal_entity_name)}</td>
            <td class=&quot;wrap&quot;>${escapeHtml(row.tax_qualify)}</td>
            <td>${escapeHtml(row.benefit_legal_entity_code)}</td>
            <td class=&quot;wrap&quot;>${escapeHtml(row.benefit_legal_entity_name)}</td>
            <td class=&quot;wrap&quot;>${escapeHtml(row.benefit_tax_qualify)}</td>

            <td>${row.amount}</td>
            <td><span class=&quot;tag ${statusClass(row.check_status)}&quot;>${row.check_status_cn}</span></td>
            <td class=&quot;wrap muted&quot;>${escapeHtml(row.draft_file)}</td>
          </tr>

      }).join('');

      document.getElementById('totalCount').textContent = rows.length;
      const all = rows.length > 0 &amp;&amp; rows.every((r) => selectedIds.has(r.id));
      document.getElementById('checkAll').checked = all;
      syncActionButtons();
    }

    function syncActionButtons() {
      const has = selectedIds.size > 0;
      document.getElementById('btnDownloadDraft').disabled = !has;
      document.getElementById('btnSubmitAudit').disabled = !has;
    }

    function toggleAll(checked) {
      selectedIds = checked ? new Set(rows.map((r) => r.id)) : new Set();
      renderTable();
    }

    function toggleRow(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      renderTable();
    }

    function getSelectedRows() {
      return rows.filter((r) => selectedIds.has(r.id));
    }

    function resetFilter() {
      document.getElementById('fMonth').value = '2020-07';
      document.getElementById('fType').value = '';
      toast('已重置筛选（原型）', 'info');
    }

    /* -------- 导入 -------- */
    function openImportModal() {
      picked = { result: null, draft: null };
      document.getElementById('fileResult').value = '';

    function downloadDetails() {

    /* -------- 下载计算底稿 -------- */
    function downloadDrafts() {
      const selected = getSelectedRows();
      if (!selected.length) {
        toast('请先勾选明细', 'info');
        return;
      }

      // 按底稿文件去重，多文件依次下载
      const files = [];
      const seen = new Set();
      selected.forEach((r) => {
        if (!seen.has(r.draft_file)) {
          seen.add(r.draft_file);
          files.push(r.draft_file);
        }
      });

      let i = 0;
      const run = () => {
        if (i >= files.length) {
          toast(`计算底稿下载完成，共 ${files.length} 个文件`, 'ok');
          return;
        }
        toast(`正在下载（${i + 1}/${files.length}）：${files[i]}`, 'info');
        i += 1;
        setTimeout(run, 700);
      };
      run();
    }

    /* -------- 提交审核 -------- */
    function submitAudit() {
      const selected = getSelectedRows();
      if (!selected.length) {
        toast('请先勾选明细', 'info');
        return;
      }

      // 同一批明细必须全选：按 import_batch_id 校验
      const touchedBatches = [...new Set(selected.map((r) => r.import_batch_id))];
      for (const batchId of touchedBatches) {
        const batchAll = rows.filter((r) => r.import_batch_id === batchId);
        const batchSelected = selected.filter((r) => r.import_batch_id === batchId);
        if (batchSelected.length < batchAll.length) {

        }

      document.getElementById('confirmBody').textContent = body;

    function toast(msg, type = 'error') {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'ok' ? ' ok' : type === 'info' ? ' info' : '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 2600);

    document.getElementById('confirmMask').addEventListener('click', (e) => {
      if (e.target.id === 'confirmMask') closeConfirm();
    });

  <script>
    (function () {
      function bindSider() {
        document.querySelectorAll('.sider .menu-item[data-menu]').forEach(function (el) {
          el.addEventListener('click', function () {
            var key = el.getAttribute('data-menu');
            var sub = document.querySelector('.sider .submenu[data-menu=&quot;' + key + '&quot;]');
            if (!sub) return;
            var open = el.classList.contains('open');
            // 手风琴：先收起其他可展开菜单
            document.querySelectorAll('.sider .menu-item[data-menu]').forEach(function (m) {
              m.classList.remove('open');
            });
            document.querySelectorAll('.sider .submenu[data-menu]').forEach(function (s) {
              s.classList.remove('show');
            });
            if (!open) {
              el.classList.add('open');
              sub.classList.add('show');
            }
          });
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindSider);
      } else {
        bindSider();
      }
    })();

        beforeRate: '0.00%',
        median: '7.50%'
      });
    });

    let rows = JSON.parse(JSON.stringify(baseRows));
    let filteredRows = [];
    let selectedIds = new Set();
    let pendingMissingIds = [];
    let currentTab = 'current';

    function cloneRows() {
      rows = JSON.parse(JSON.stringify(baseRows));
    }

    function isReviewed(row) {
      return !!row.reviewer_at;
    }

    function isCurrentMonth(row) {
      return row.month === accountMonth;
    }

    function canSelectRow(row) {
      return currentTab === 'current' &amp;&amp; isCurrentMonth(row) &amp;&amp; row.kind !== 'offset';
    }

    function isOffsetRow(row) {
      return row.kind === 'offset';
    }

    function parseMoney(value) {
      return Number(String(value || '0').replace(/,/g, '')) || 0;
    }

    function formatMoney(value) {
      return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function monthOffsetRows(month) {
      return rows.filter((row) => row.kind === 'offset' &amp;&amp; row.month === month);
    }

    function switchTab(tab) {
      if (tab === 'offset' &amp;&amp; !monthOffsetRows(document.getElementById('fMonth').value).length) return;
      currentTab = tab;
      selectedIds.clear();
      renderTable();
    }

    function voucherTagClass(status) {
      if (status === '推送成功') return 'v-success';
      if (status === '推送失败') return 'v-fail';
      if (status === '已撤回') return 'v-revoke';
      return '';
    }

    function invoiceTagClass(status) {
      if (status === '待开票') return 'i-pending';
      if (status === '开票失败') return 'i-fail';
      if (status === '已开票') return 'i-success';
      if (status === '无票') return 'i-none';
      return '';
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      const month = document.getElementById('fMonth').value;
      const subject = document.getElementById('fSubject').value.trim().toUpperCase();
      const source = document.getElementById('fSource').value;
      const reviewer = document.getElementById('fReviewer').value;
      const confirm = document.getElementById('fConfirm').value;
      const offsetCount = monthOffsetRows(month).length;
      const currentCount = rows.filter((row) => row.kind !== 'offset' &amp;&amp; row.month === month).length;
      const isOffsetTab = currentTab === 'offset';

      if (isOffsetTab &amp;&amp; !offsetCount) currentTab = 'current';

      document.getElementById('tabCurrent').classList.toggle('active', currentTab === 'current');
      document.getElementById('tabOffset').classList.toggle('active', currentTab === 'offset');
      document.getElementById('tabOffset').style.display = offsetCount ? '' : 'none';
      document.getElementById('countCurrent').textContent = currentCount;
      document.getElementById('countOffset').textContent = offsetCount;
      document.getElementById('toolbarCurrent').style.display = currentTab === 'current' ? '' : 'none';
      document.getElementById('toolbarOffset').style.display = currentTab === 'offset' ? '' : 'none';
      document.getElementById('thCheck').style.display = currentTab === 'offset' ? 'none' : '';
      document.getElementById('fReviewer').parentElement.style.display = currentTab === 'offset' ? 'none' : '';
      document.getElementById('fConfirm').parentElement.style.display = currentTab === 'offset' ? 'none' : '';

      filteredRows = rows.filter((row) => {
        if (currentTab === 'offset' ? row.kind !== 'offset' : row.kind === 'offset') return false;
        if (month &amp;&amp; row.month !== month) return false;
        if (subject &amp;&amp; !(row.legal_entity_eas_code.toUpperCase().includes(subject) || row.legal_entity_name.includes(subject))) return false;
        if (source &amp;&amp; row.source !== source) return false;
        if (currentTab === 'current') {
          if (reviewer === 'Y' &amp;&amp; !isReviewed(row)) return false;
          if (reviewer === 'N' &amp;&amp; isReviewed(row)) return false;
          if (confirm &amp;&amp; row.transaction_result_confirm !== confirm) return false;
        }
        return true;
      });

      tbody.innerHTML = filteredRows.map((row) => {
        const checked = selectedIds.has(row.id) ? 'checked' : '';
        const selected = selectedIds.has(row.id) ? 'selected' : '';
        const disabledRow = canSelectRow(row) ? '' : (currentTab === 'offset' ? '' : 'disabled-row');
        const disabledCheck = canSelectRow(row) ? '' : 'disabled';
        const reviewText = currentTab === 'offset' ? '-' : (isReviewed(row) ? '已审核' : '未审核');
        const reviewClass = currentTab === 'offset' ? '' : (isReviewed(row) ? 'reviewed' : 'unreviewed');
        const confirmText = currentTab === 'offset' ? '不参与' : row.transaction_result_confirm;
        const confirmClass = confirmText === '已确认' ? 'confirmed' : confirmText === '未确认' ? 'unconfirmed' : '';
        const voucherText = row.deletedVoucher ? '已删除' : row.voucher_status;
        const invoiceText = row.deletedInvoice ? '已删除' : row.invoice_status;
        const voucherClass = row.deletedVoucher ? 'deleted' : voucherTagClass(voucherText);
        const invoiceClass = row.deletedInvoice ? 'deleted' : invoiceTagClass(invoiceText);
        const offsetClass = parseMoney(row.toOffset) !== 0 ? 'offset-nonzero' : '';
        const checkCell = currentTab === 'offset'
          ? ''
          : `<td><input type=&quot;checkbox&quot; ${checked} ${disabledCheck} onchange=&quot;toggleRow(${row.id}, this.checked)&quot; /></td>`;
        return `
          <tr class=&quot;${selected} ${disabledRow}&quot;>
            ${checkCell}
            <td>${row.id}</td>
            <td>${row.source}</td>
            <td>${row.month}</td>
            <td>${row.legal_entity_eas_code}</td>
            <td class=&quot;wrap&quot;>${row.legal_entity_name}</td>
            <td><span class=&quot;tag&quot;>${row.this_month_tp}</span></td>
            <td class=&quot;money&quot;>${row.income}</td>
            <td class=&quot;money&quot;>${row.cost}</td>
            <td class=&quot;money&quot;>${row.histTp}</td>
            <td class=&quot;money&quot;>${row.totalTp}</td>
            <td class=&quot;money&quot;>${row.realTp}</td>
            <td class=&quot;money ${offsetClass}&quot;>${row.toOffset}</td>
            <td class=&quot;money&quot;>${row.beforeCost}</td>
            <td class=&quot;money&quot;>${row.beforeProfit}</td>
            <td>${row.beforeRate}</td>
            <td>${row.median}</td>
            <td><span class=&quot;tag ${confirmClass}&quot;>${confirmText}</span></td>
            <td><span class=&quot;tag ${reviewClass}&quot;>${reviewText}</span></td>
            <td><span class=&quot;tag ${voucherClass}&quot;>${voucherText}</span></td>
            <td><span class=&quot;tag ${invoiceClass}&quot;>${invoiceText}</span></td>
            <td><code>${row.review_batch || '-'}</code></td>
            <td><code>${row.review_group || '-'}</code></td>
            <td>${row.reviewer_by || '-'}</td>
            <td>${row.reviewer_at || '-'}</td>
          </tr>
        `;
      }).join('');

      const sumYear = filteredRows.reduce((s, row) => s + parseMoney(row.histTp), 0);
      const sumTotal = filteredRows.reduce((s, row) => s + parseMoney(row.totalTp), 0);
      const sumReal = filteredRows.reduce((s, row) => s + parseMoney(row.realTp), 0);
      const sumOffset = filteredRows.reduce((s, row) => s + parseMoney(row.toOffset), 0);
      document.getElementById('summaryBar').innerHTML =
        `合计：1到上月入账累计TP <b>${formatMoney(sumYear)}</b>　1到本月计算累计TP <b>${formatMoney(sumTotal)}</b>　本期实际入账TP <b>${formatMoney(sumReal)}</b>　待冲销TP金额 <b>${formatMoney(sumOffset)}</b>`;

      document.getElementById('totalCount').textContent = filteredRows.length;
      document.getElementById('selectedMonthText').textContent = month;

      const selectableIds = filteredRows.filter(canSelectRow).map((r) => r.id);
      const all = selectableIds.length > 0 &amp;&amp; selectableIds.every((id) => selectedIds.has(id));
      document.getElementById('checkAll').checked = all;
      syncActionButtons();
    }

    function applyFilters() {
      selectedIds.clear();
      if (currentTab === 'offset' &amp;&amp; !monthOffsetRows(document.getElementById('fMonth').value).length) {
        currentTab = 'current';
      }
      renderTable();
    }

    function resetFilters() {
      document.getElementById('fMonth').value = accountMonth;
      document.getElementById('fSubject').value = '';
      document.getElementById('fSource').value = '';
      document.getElementById('fReviewer').value = '';
      document.getElementById('fConfirm').value = '';
      selectedIds.clear();
      renderTable();
      toast('已重置筛选条件', 'info');
    }

    function toggleAll(checked) {
      if (checked) {
        filteredRows.filter(canSelectRow).forEach((row) => selectedIds.add(row.id));
      } else {
        filteredRows.forEach((row) => selectedIds.delete(row.id));
      }
      renderTable();
    }

    function toggleRow(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      renderTable();
    }

    function getSelectedRows() {
      return rows.filter((row) => selectedIds.has(row.id));
    }

    function syncActionButtons() {
      const selected = getSelectedRows();
      const has = selected.length > 0;
      const currentPageMonth = document.getElementById('fMonth').value;
      const currentMonthOnly = currentPageMonth === accountMonth;
      const allConfirmed = has &amp;&amp; selected.every((row) => row.transaction_result_confirm === '已确认');
      const allUnconfirmed = has &amp;&amp; selected.every((row) => row.transaction_result_confirm === '未确认');
      const allReviewed = has &amp;&amp; selected.every((row) => isReviewed(row));
      const allUnreviewed = has &amp;&amp; selected.every((row) => !isReviewed(row));

      document.getElementById('btnConfirmTp').disabled = !currentMonthOnly || !has || !allUnconfirmed;
      document.getElementById('btnCancelTp').disabled = !currentMonthOnly || !has || !allConfirmed || !allUnreviewed;
      document.getElementById('btnReview').disabled = !currentMonthOnly || !has || !allConfirmed || !allUnreviewed;
      document.getElementById('btnUnreview').disabled = !currentMonthOnly || !has;
    }

    function handleConfirmTp() {
      const selected = getSelectedRows();
      if (!selected.length) return toast('请选择未确认明细', 'info');
      if (selected.some((row) => row.transaction_result_confirm !== '未确认')) {
        return toast('所选数据包含已确认数据，请检查');
      }
      openConfirm('确认本月TP结果', '确认后数据将变为“已确认”，仍需后续审核。', () => {
        selected.forEach((row) => {
          row.transaction_result_confirm = '已确认';
        });
        selectedIds.clear();
        closeConfirm();
        renderTable();
        toast('确认成功', 'ok');
      });
    }

    function handleCancelTp() {
      const selected = getSelectedRows();
      if (!selected.length) return toast('请选择已确认未审核明细', 'info');
      if (selected.some((row) => row.transaction_result_confirm !== '已确认' || isReviewed(row))) {
        return toast('取消确认仅支持已确认且未审核的数据');
      }
      openConfirm('取消确认', '取消确认后，数据将回到“未确认”状态。', () => {
        selected.forEach((row) => {
          row.transaction_result_confirm = '未确认';
        });
        selectedIds.clear();
        closeConfirm();
        renderTable();
        toast('取消确认成功', 'ok');
      });
    }

    function handleReview() {
      const selected = getSelectedRows();
      if (!selected.length) return toast('请选择已确认未审核明细', 'info');
      if (selected.some((row) => row.transaction_result_confirm !== '已确认' || isReviewed(row))) {
        return toast('审核仅支持已确认且未审核的数据');
      }
      openConfirm('TP结果审核', '审核后将生成凭证数据；凭证推送后才会生成发票。确认继续吗？', () => {
        const now = '2026-08-28 16:40:00';
        const batch = 'AUD-202411-' + String(Math.floor(Math.random() * 90 + 10));
        selected.forEach((row) => {
          row.reviewer_at = now;
          row.reviewer_by = '刘玉婷(198612)';
          row.review_batch = batch;
          row.review_group = batch + '-XF01-TAL1';
          row.voucher_status = '未推送';
          row.invoice_status = '无票';
          row.deletedVoucher = false;
          row.deletedInvoice = false;
        });
        selectedIds.clear();
        closeConfirm();
        renderTable();
        toast('审核成功：已生成待推送凭证', 'ok');
      });
    }

    function handleUnreview() {
      const selected = getSelectedRows();
      if (!selected.length) return toast('请选择已审核明细', 'info');
      if (document.getElementById('fMonth').value !== accountMonth) {
        return toast('只能操作当前账期');
      }
      if (selected.some((row) => !isReviewed(row))) {
        return toast('存在未审核数据，无法反审核');
      }
      if (selected.some((row) => row.transaction_result_confirm !== '已确认')) {
        return toast('存在未确认数据，无法反审核');
      }
      executeUnreview();
    }

    function executeUnreview() {
      const selected = getSelectedRows();
      const missing = collectMissingGroupRows(selected);
      if (missing.length) {
        pendingMissingIds = missing.map((row) => row.id);
        document.getElementById('groupMissingList').innerHTML = missing
          .map((row) => `
            <tr>
              <td>${row.legal_entity_eas_code}</td>
              <td>${row.legal_entity_name}</td>
              <td>${row.legal_entity_1_name}</td>
              <td>${row.legal_entity_2_name}</td>
            </tr>
          `)
          .join('');
        document.getElementById('groupMask').classList.add('show');
        return;
      }

      if (selected.some((row) => row.voucher_status === '推送成功' || row.voucher_status === '推送中')) {
        return toast('选择的TP明细凭证已推送，无法反审核');
      }

      if (selected.some((row) => ['已开票', '开票中', '合并票', '拆分票', '无需开票'].includes(row.invoice_status))) {
        return toast('选择的TP明细存在拆分票/合并票/已开票/开票中/无需开票的发票，无法反审核');
      }

      openConfirm('TP结果反审核', '反审核会删除对应凭证及发票，确认要反审核TP明细吗？', () => {
        selected.forEach((row) => {
          row.reviewer_at = '';
          row.reviewer_by = '';
          row.deletedVoucher = true;
          if (row.invoice_status === '待开票' || row.invoice_status === '开票失败') {
            row.deletedInvoice = true;
          }
          row.voucher_status = '未推送';
          if (row.invoice_status !== '无票') {
            row.invoice_status = row.deletedInvoice ? '已删除' : row.invoice_status;
          }
        });
        selectedIds.clear();
        closeConfirm();
        renderTable();
        toast('反审核成功：已清空审核信息，并模拟删除对应凭证/可删发票', 'ok');
      });
    }

    function collectMissingGroupRows(selected) {
      const selectedIdsArray = selected.map((row) => row.id);
      const missing = [];
      const seen = new Set();
      selected.forEach((row) => {
        if (!row.review_batch) return;
        rows.forEach((candidate) => {
          if (
            candidate.kind !== 'offset' &amp;&amp;
            candidate.review_batch === row.review_batch &amp;&amp;
            candidate.month === row.month &amp;&amp;
            candidate.transaction_result_confirm === '已确认' &amp;&amp;
            isReviewed(candidate) &amp;&amp;
            !selectedIdsArray.includes(candidate.id) &amp;&amp;
            !seen.has(candidate.id)
          ) {
            missing.push(candidate);
            seen.add(candidate.id);
          }
        });
      });
      return missing;
    }

    function selectMissingAndRetry() {
      pendingMissingIds.forEach((id) => selectedIds.add(id));
      closeGroupModal();
      renderTable();
      toast('已补齐同一审核批次明细，请再次点击TP结果反审核', 'info');
    }

    function openConfirm(title, body, onOk) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmBody').textContent = body;
      document.getElementById('confirmOk').onclick = onOk;
      document.getElementById('confirmMask').classList.add('show');
    }

    function closeConfirm() {
      document.getElementById('confirmMask').classList.remove('show');
    }

    function closeGroupModal() {
      pendingMissingIds = [];
      document.getElementById('groupMask').classList.remove('show');
    }

    function toast(msg, type = 'error') {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'ok' ? ' ok' : type === 'info' ? ' info' : '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    document.getElementById('confirmMask').addEventListener('click', function (e) {
      if (e.target.id === 'confirmMask') closeConfirm();
    });
    document.getElementById('groupMask').addEventListener('click', function (e) {
      if (e.target.id === 'groupMask') closeGroupModal();
    });

    cloneRows();
    renderTable();
  </script>
</body>

  <script>
    function clearMenuActive() {
      document.querySelectorAll('.sider .menu-item').forEach(el => el.classList.remove('active-root'));
      document.querySelectorAll('.sider .sub-item').forEach(el => el.classList.remove('active'));
    }

    function showPage(page) {
      const inv = document.getElementById('frameInvoice');
      const ty = document.getElementById('frameTongyong');
      const py = document.getElementById('framePeiyouResult');
      const zb = document.getElementById('frameZbProduct');
      const menuInv = document.getElementById('menuInvoice');
      const menuPy = document.getElementById('menuPeiyou');
      const menuTy = document.getElementById('menuTongyong');
      const menuJf = document.getElementById('menuJifen');
      const subPy = document.getElementById('subPeiyou');
      const sub = document.getElementById('subTongyong');
      const subJf = document.getElementById('subJifen');
      const menuPyResult = document.getElementById('menuPeiyouResult');
      const menuResult = document.getElementById('menuResult');
      const menuZbProduct = document.getElementById('menuZbProduct');

      clearMenuActive();
      inv.classList.remove('active');
      py.classList.remove('active');
      ty.classList.remove('active');
      zb.classList.remove('active');

      if (page === 'invoice') {
        inv.classList.add('active');
        menuInv.classList.add('active-root');
        menuPy.classList.remove('open');
        subPy.classList.remove('show');
        menuTy.classList.remove('open');
        sub.classList.remove('show');
        menuJf.classList.remove('open');
        subJf.classList.remove('show');
      } else if (page === 'peiyou') {
        py.classList.add('active');
        menuPy.classList.add('open');
        subPy.classList.add('show');
        menuPyResult.classList.add('active');
        menuTy.classList.remove('open');
        sub.classList.remove('show');
        menuJf.classList.remove('open');
        subJf.classList.remove('show');
      } else if (page === 'tongyong') {
        ty.classList.add('active');
        menuTy.classList.add('open');
        sub.classList.add('show');
        menuResult.classList.add('active');
        menuPy.classList.remove('open');
        subPy.classList.remove('show');
        menuJf.classList.remove('open');
        subJf.classList.remove('show');
      } else if (page === 'zbproduct') {
        zb.classList.add('active');
        menuJf.classList.add('open');
        subJf.classList.add('show');
        menuZbProduct.classList.add('active');
        menuPy.classList.remove('open');
        subPy.classList.remove('show');
        menuTy.classList.remove('open');
        sub.classList.remove('show');
      }
    }

    function toggleMenu(menuId, subId) {
      const menu = document.getElementById(menuId);
      const sub = document.getElementById(subId);
      const open = menu.classList.contains('open');
      if (open) {
        menu.classList.remove('open');
        sub.classList.remove('show');
      } else {
        menu.classList.add('open');
        sub.classList.add('show');
      }
    }

    document.getElementById('menuPeiyou').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu('menuPeiyou', 'subPeiyou');
    });

    document.getElementById('menuTongyong').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu('menuTongyong', 'subTongyong');
    });

    document.getElementById('menuJifen').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu('menuJifen', 'subJifen');
    });

    document.getElementById('menuInvoice').addEventListener('click', function () {
      showPage('invoice');
    });

    document.querySelectorAll('#subPeiyou .sub-item').forEach(function (el) {
      el.addEventListener('click', function () {
        const page = el.getAttribute('data-page');
        if (page === 'peiyou') {
          showPage('peiyou');
        } else {
          document.querySelectorAll('#subPeiyou .sub-item').forEach(s => s.classList.remove('active'));
          el.classList.add('active');
          alert('「' + el.textContent.replace('+','') + '」暂未做原型页，当前可切换：培优技术关联交易 / 发票模块 / 关联交易结果明细 / 指标商品配置');
        }
      });
    });

    document.querySelectorAll('#subTongyong .sub-item').forEach(function (el) {
      el.addEventListener('click', function () {
        const page = el.getAttribute('data-page');
        if (page === 'tongyong') {
          showPage('tongyong');
        } else {
          document.querySelectorAll('#subTongyong .sub-item').forEach(s => s.classList.remove('active'));
          el.classList.add('active');
          alert('「' + el.textContent.replace('+','') + '」暂未做原型页，当前可切换：发票模块 / 关联交易结果明细 / 指标商品配置');
        }
      });
    });

    document.querySelectorAll('#subJifen .sub-item').forEach(function (el) {
      el.addEventListener('click', function () {
        const page = el.getAttribute('data-page');
        if (page === 'zbproduct') showPage('zbproduct');
      });
    });

    showPage('peiyou');
  </script>
